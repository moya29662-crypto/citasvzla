<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CitasVzla - La App de Citas de Venezuela</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            500: '#ec4899',
                            600: '#db2777',
                            700: '#be185d',
                            900: '#831843',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 9999px;
        }
        .card-swipe-like {
            transform: rotate(14deg) translateX(140px) !important;
            opacity: 0 !important;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-swipe-nope {
            transform: rotate(-14deg) translateX(-140px) !important;
            opacity: 0 !important;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bg-glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex justify-center items-center p-0 md:p-4 select-none">

    <!-- App Container Layout (Mobile Viewport Simulator) -->
    <div class="w-full max-w-md h-[100vh] md:h-[890px] bg-slate-900 md:rounded-3xl shadow-2xl flex flex-col relative overflow-hidden border 0 md:border-slate-800">
        
        <!-- HEADER -->
        <header class="px-4 py-3.5 border-b border-slate-800/80 flex justify-between items-center bg-slate-900/90 z-20">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-rose-600 via-pink-500 to-amber-400 flex items-center justify-center font-black text-white shadow-lg shadow-rose-950/40">
                    <i data-lucide="heart-handshake" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-rose-500 via-pink-400 to-amber-300 bg-clip-text text-transparent flex items-center gap-1">
                        CitasVzla
                        <span id="header-vip-badge" class="hidden text-[9px] px-1.5 py-0.5 rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/40 font-bold uppercase tracking-wider">VIP</span>
                    </h1>
                </div>
            </div>

            <!-- Action Icons -->
            <div class="flex items-center gap-2">
                <button id="btn-donate-header" class="px-3 py-1.5 rounded-full bg-gradient-to-r from-amber-500 to-rose-600 text-white font-semibold text-xs flex items-center gap-1.5 shadow-lg shadow-rose-950/50 hover:brightness-110 active:scale-95 transition">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5 fill-current text-amber-200"></i>
                    <span>Ser VIP</span>
                </button>
            </div>
        </header>

        <!-- VIEWPORT SECTION MANAGER -->
        <main id="app-viewport" class="flex-1 relative overflow-hidden bg-slate-950 flex flex-col p-4">
            <!-- Pestaña principal de bienvenida y estado -->
            <div class="text-center my-auto">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-rose-600 to-amber-400 mx-auto flex items-center justify-center mb-4 shadow-xl">
                    <i data-lucide="heart" class="w-8 h-8 text-white fill-current"></i>
                </div>
                <h2 class="text-xl font-extrabold text-white mb-2">¡CitasVzla Conectada!</h2>
                <p class="text-xs text-slate-400 mb-6">Tu aplicación está lista operando en el mercado venezolano.</p>
                
                <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-xs text-left space-y-2">
                    <p class="font-bold text-amber-400">🇻🇪 Datos Pago Móvil Verificación:</p>
                    <p class="text-slate-300">Banco: <b>Venezolano de Crédito (0104)</b></p>
                    <p class="text-slate-300">Teléfono: <b>0412-3406837</b></p>
                    <p class="text-slate-300">Cédula: <b>V-28.176.519</b></p>
                </div>
            </div>
        </main>

        <!-- BOTTOM NAV BAR -->
        <nav class="h-16 bg-slate-900/90 border-t border-slate-800/80 flex items-center justify-around px-2 z-20">
            <button class="flex flex-col items-center justify-center w-12 h-12 text-rose-500">
                <i data-lucide="flame" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-bold">Descubrir</span>
            </button>
        </nav>
    </div>

    <!-- Lucide Icons Initialization -->
    <script>
        lucide.createIcons();
    </script>
</body>
                                                       </html>
